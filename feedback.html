<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Feedback Form</title>
   <link rel="stylesheet" href="/static/FORM.CSS">
    <link rel="stylesheet" href="fav">
    <style>
        /* CSS to style the rating system for each topic */
        .rating-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .rating-item:last-child {
            border-bottom: none;
        }
        .rating-label {
            font-weight: bold;
            flex-basis: 50%; /* Gives space for the label */
        }
        .rating-scale {
            display: flex;
            gap: 5px; /* Space between numbers */
            flex-basis: 50%;
            justify-content: flex-end;
        }
        .rating-scale input[type="radio"] {
            /* Hide the default radio button */
            display: none;
        }
        .rating-scale label {
            /* Style for the clickable number */
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
            text-align: center;
        }
        .rating-scale input[type="radio"]:checked + label {
            background-color: #007bff; /* Primary button color from your original form */
            color: white;
            border-color: #007bff;
        }
        .rating-scale label:hover {
            background-color: #e9e9e9;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1 class="form-title">
            FEEDBACK
        </h1>
        <p class="form-description">Please rate your experience with each category below (1 = Poor, 2 = Fair, 3 = Average, 4 = Good,5 = very good).</p>
        
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="feedback-email">Email</label>
                <input type="email" id="feedback-email" name="email" placeholder="Enter your email address">
            </div>

            
            
            <h2 style="margin-top: 20px; font-size: 1.2em;">Rate Specific Areas</h2>

            <div class="form-group rating-item">
                <span class="rating-label">Product Quality</span>
                <div class="rating-scale">
                    <input type="radio" id="quality1" name="product_quality" value="1" required><label for="quality1">1</label>
                    <input type="radio" id="quality2" name="product_quality" value="2"><label for="quality2">2</label>
                    <input type="radio" id="quality3" name="product_quality" value="3"><label for="quality3">3</label>
                    <input type="radio" id="quality4" name="product_quality" value="4"><label for="quality4">4</label>
                    <input type="radio" id="quality5" name="product_quality" value="5"><label for="quality5">5</label>
                </div>
            </div>

            <div class="form-group rating-item">
                <span class="rating-label">Website Usability</span>
                <div class="rating-scale">
                    <input type="radio" id="usability1" name="website_usability" value="1" required><label for="usability1">1</label>
                    <input type="radio" id="usability2" name="website_usability" value="2"><label for="usability2">2</label>
                    <input type="radio" id="usability3" name="website_usability" value="3"><label for="usability3">3</label>
                    <input type="radio" id="usability4" name="website_usability" value="4"><label for="usability4">4</label>
                    <input type="radio" id="usability5" name="website_usability" value="5"><label for="usability5">5</label>
                </div>
            </div>

            <div class="form-group rating-item">
                <span class="rating-label">Customer Service</span>
                <div class="rating-scale">
                    <input type="radio" id="service1" name="customer_service" value="1" required><label for="service1">1</label>
                    <input type="radio" id="service2" name="customer_service" value="2"><label for="service2">2</label>
                    <input type="radio" id="service3" name="customer_service" value="3"><label for="service3">3</label>
                    <input type="radio" id="service4" name="customer_service" value="4"><label for="service4">4</label>
                    <input type="radio" id="service5" name="customer_service" value="5"><label for="service5">5</label>
                </div>
            </div>

            <div class="form-group rating-item">
                <span class="rating-label">Delivery & Shipping</span>
                <div class="rating-scale">
                    <input type="radio" id="delivery1" name="delivery_shipping" value="1" required><label for="delivery1">1</label>
                    <input type="radio" id="delivery2" name="delivery_shipping" value="2"><label for="delivery2">2</label>
                    <input type="radio" id="delivery3" name="delivery_shipping" value="3"><label for="delivery3">3</label>
                    <input type="radio" id="delivery4" name="delivery_shipping" value="4"><label for="delivery4">4</label>
                    <input type="radio" id="delivery5" name="delivery_shipping" value="5"><label for="delivery5">5</label>
                </div>
            </div>
            
            

            <div class="form-group" style="margin-top: 20px;">
                <label for="comments">Any Additional Comments?</label>
                <textarea id="comments" name="comments" rows="5" placeholder="Share details about any of the ratings above..."></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary form-submit-btn">Submit Feedback</button>
        </form>
    </div>

</body>
</html>
