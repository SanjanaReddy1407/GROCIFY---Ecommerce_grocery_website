<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details Form</title>
    <link rel="stylesheet" href="/static/FORM.CSS">
    <link rel="stylesheet" href="fav">
    
</head>
<body>

    <div class="form-container">
        <h1 class="form-title">PROFILE DETAILS


        </h1>
        <p class="form-description">Please fill out the form below to place your order.</p>
        
        <form action="#" method="POST">
            
            
            <div class="form-group">
                <label for="name">First Name</label>
                <input type="text" id="name" name="name" placeholder="Enter firstname" required>
            </div>

            <div class="form-group">
                <label for="name">Last Name</label>
                <input type="text" id="name" name="name" placeholder="Enter lastname" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            </div>
            <div class="form-group">
                <label for="phone">Contact Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
            </div>
            
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" placeholder="Enter your address" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

             <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter pass" required>
            </div>

            <div class="form-group">
                <label for="password">Re-EnterPassword</label>
                <input type="password" id="password" name="password" placeholder="Enter pass" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select name="gender">
                    <option value="male">male</option>
                    <option value="female">female</option>
                </select>
               
            </div>

            
                

            <button type="submit" class="btn btn-primary form-submit-btn">Submit Details</button>
        </form>
    </div>

</body>
</html>
